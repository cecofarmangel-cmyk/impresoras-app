<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reporte - Impresora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            padding: 30px;
            text-align: center;
            color: white;
        }
        .header.averia { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .header.toner { background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%); }
        .header h1 { font-size: 1.4rem; margin-bottom: 5px; }
        .content { padding: 25px; }
        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .info-box h3 { margin-bottom: 12px; color: #333; font-size: 1rem; }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e0e0e0; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #666; font-size: 0.85rem; }
        .info-value { color: #333; font-weight: 600; font-size: 0.85rem; text-align: right; flex: 1; margin-left: 10px; word-break: break-word; }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .btn-primary.averia { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
        .btn-primary.toner { background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%); }
        .btn-secondary { background: #34495e; }
        
        .error { text-align: center; padding: 40px; color: #e74c3c; }
        .loading { text-align: center; padding: 50px; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .fallback { 
            margin-top: 20px; 
            padding: 15px; 
            background: #fff3cd; 
            border-radius: 8px; 
            border-left: 4px solid #ffc107;
            font-size: 0.85rem; 
            color: #856404;
            display: none;
        }
        .fallback.visible { display: block; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <p style="color: #666;">Cargando...</p>
        </div>
    </div>

    <script>
        function processQR() {
            const params = new URLSearchParams(window.location.search);
            const tipo = params.get('t');
            const model = params.get('m');
            const serial = params.get('s');
            
            if (!tipo || !model || !serial) {
                const qrData = params.get('qr');
                if (qrData && qrData.includes('|')) {
                    showError('Este QR es de la versión antigua. Por favor, regenera los QR desde el panel de administración.');
                } else {
                    showError('QR inválido o datos incompletos.');
                }
                return;
            }
            
            const printer = {
                id: params.get('id') || 'N/A',
                model: decodeURIComponent(model),
                serial: decodeURIComponent(serial),
                location: params.get('l') ? decodeURIComponent(params.get('l')) : 'No especificada',
                tonerType: params.get('tt') ? decodeURIComponent(params.get('tt')) : 'No especificado',
                averiaEmail: params.get('ae') ? decodeURIComponent(params.get('ae')) : 'soporte@tuempresa.com',
                tonerEmail: params.get('te') ? decodeURIComponent(params.get('te')) : 'compras@tuempresa.com'
            };
            
            renderPage(tipo, printer);
        }

        function renderPage(tipo, printer) {
            const isAveria = tipo === 'averia';
            const destinatario = isAveria ? printer.averiaEmail : printer.tonerEmail;
            const asunto = isAveria 
                ? `AVERÍA - ${printer.model} - Serie: ${printer.serial}`
                : `PEDIDO TÓNER - ${printer.model} - Serie: ${printer.serial}`;
            const cuerpo = isAveria ? generarCuerpoAveria(printer) : generarCuerpoToner(printer);
            
            // Crear mailto URL
            const mailtoURL = `mailto:${destinatario}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
            
            // Generar contenido .eml
            const emlContent = generarEML(destinatario, asunto, cuerpo.replace(/%0A/g, '\n').replace(/%0D/g, '\r'));
            const emlBlob = new Blob([emlContent], { type: 'message/rfc822' });
            const emlUrl = URL.createObjectURL(emlBlob);

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="container">
                    <div class="header ${isAveria ? 'averia' : 'toner'}">
                        <h1>${isAveria ? '🔴 Reportar Avería' : '🟢 Solicitar Tóner'}</h1>
                        <p>${printer.model} — ${printer.id}</p>
                    </div>
                    <div class="content">
                        <div class="info-box">
                            <h3>📋 Datos de la Impresora</h3>
                            <div class="info-row"><span class="info-label">Modelo:</span><span class="info-value">${printer.model}</span></div>
                            <div class="info-row"><span class="info-label">Serie:</span><span class="info-value">${printer.serial}</span></div>
                            <div class="info-row"><span class="info-label">Ubicación:</span><span class="info-value">${printer.location}</span></div>
                            <div class="info-row"><span class="info-label">Tóner:</span><span class="info-value">${printer.tonerType}</span></div>
                        </div>
                        
                        <div class="btn-group">
                            <a href="${mailtoURL}" class="btn btn-primary ${isAveria ? 'averia' : 'toner'}" onclick="handleMailto(event)">
                                📧 Abrir en App de Correo
                            </a>
                            <a href="${emlUrl}" download="${isAveria ? 'Averia' : 'Toner'}_${printer.id}.eml" class="btn btn-secondary">
                                💾 Descargar archivo .eml
                            </a>
                        </div>
                        
                        <div id="fallback" class="fallback">
                            <strong>⚠️ Si no se abrió el correo:</strong><br>
                            Intenta el botón de descarga arriba, o 
                            <a href="${mailtoURL}" style="color: #856404; font-weight: bold;">haz clic aquí</a>.
                        </div>
                    </div>
                </div>
            `;
        }

        function handleMailto(e) {
            // El enlace <a> con href="mailto:" funciona mejor que window.open
            // porque el navegador lo trata como navegación del usuario
            setTimeout(() => {
                const fb = document.getElementById('fallback');
                if (fb) fb.classList.add('visible');
            }, 3000);
        }

        function generarCuerpoAveria(p) {
            return `=========================================
📠 REPORTE DE AVERÍA EN IMPRESORA
=========================================

🖨️ MODELO: ${p.model}
🔢 NÚMERO DE SERIE: ${p.serial}
📍 UBICACIÓN: ${p.location}

─────────────────────────────────────────
⚠️ DESCRIPCIÓN DEL PROBLEMA:
─────────────────────────────────────────

[Describe aquí la avería]

─────────────────────────────────────────
📅 FECHA: ${new Date().toLocaleString('es-ES')}
👤 REPORTADO POR: [Mantenimiento Córdoba]

=========================================`;
        }

        function generarCuerpoToner(p) {
            return `=========================================
🖨️ SOLICITUD DE TÓNER
=========================================

🖨️ MODELO: ${p.model}
🔢 NÚMERO DE SERIE: ${p.serial}
📍 UBICACIÓN: ${p.location}
📦 TÓNER COMPATIBLE: ${p.tonerType}

─────────────────────────────────────────
📊 CANTIDAD SOLICITADA:
─────────────────────────────────────────

[X] 1 unidad
[ ] 2 unidades
color: negro[x] amarillo [ ] cian [ ] magenta [ ]

─────────────────────────────────────────
📅 FECHA: ${new Date().toLocaleString('es-ES')}
👤 SOLICITADO POR: [Mantenimiento Córdoba]

=========================================`;
        }

        function generarEML(to, subject, body) {
            // Formato .eml básico (RFC 5322)
            const boundary = '----=_NextPart_' + Date.now();
            const date = new Date().toUTCString();
            
            return `MIME-Version: 1.0
From: usuario@empresa.com
To: ${to}
Subject: ${subject}
Date: ${date}
Content-Type: multipart/alternative; boundary="${boundary}"

${boundary}
Content-Type: text/plain; charset="utf-8"
Content-Transfer-Encoding: 8bit

${body}

${boundary}--
`;
        }

        function showError(msg) {
            document.getElementById('app').innerHTML = `
                <div class="container"><div class="error"><h2>❌ Error</h2><p>${msg}</p></div></div>
            `;
        }

        processQR();
    </script>
</body>
</html>
